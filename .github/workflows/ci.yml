name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  node:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://tally:tally_dev_password@localhost:5432/tally_remote
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.x
      - run: npm install
      - run: npm run prisma:validate --workspace=@tally/api
      - run: npm run build:api
      - run: npm test

  connector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build apps/connector/TallyRemoteConnector.csproj
